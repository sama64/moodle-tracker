services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uni_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-uni_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
    volumes:
      - uni_tracker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      MAX_FILE_EXTRACT_BYTES: "1000000000"
    volumes:
      - ./data/uni-tracker:/app/data/uni-tracker
      - ./data/uni-tracker/artifacts/runtime:/app/artifacts/runtime
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -lc "alembic upgrade head &&
      uvicorn uni_tracker.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      FILE_DOWNLOAD_LIMIT_PER_RUN: "1"
      MAX_FILE_EXTRACT_BYTES: "1000000000"
      PDF_EXTRACTION_TIMEOUT_SECONDS: "15"
      PDF_EXTRACTION_MEMORY_LIMIT_MB: "192"
    volumes:
      - ./data/uni-tracker:/app/data/uni-tracker
      - ./data/uni-tracker/artifacts/runtime:/app/artifacts/runtime
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    command: >
      python -m uni_tracker.worker

volumes:
  uni_tracker_postgres_data:
